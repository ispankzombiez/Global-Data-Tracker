name: Daily Active Snapshot

on:
  schedule:
    - cron: "10 0 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/daily-data.yml"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional UTC date (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Initialize Git LFS
        run: git lfs install

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull active snapshot and aggregate
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          set -euo pipefail
          echo "Workflow UTC start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "starting download"
          if [ -n "${API_KEY:-}" ]; then
            echo "API_KEY detected in workflow environment"
          else
            echo "API_KEY not set; using public endpoint access"
          fi

          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "Running explicit date input: ${{ github.event.inputs.date }}"
            node scripts/runDaily.mjs "${{ github.event.inputs.date }}"
          else
            echo "Running default UTC date mode with fallback"
            node scripts/runDaily.mjs
          fi

      - name: Commit data changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/active data/processed data/processed-data
          git commit -m "data: active snapshot $(date -u +%F)"
          git push
