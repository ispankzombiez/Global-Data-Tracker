name: Daily Active Snapshot

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional UTC date (YYYY-MM-DD). Leave blank for today."
        required: false
        type: string

concurrency:
  group: daily-active-snapshot-main
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull active snapshot and aggregate
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          set -euo pipefail
          echo "Workflow UTC start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "starting download"
          echo "::notice::starting download"
          if [ -n "${API_KEY:-}" ]; then
            echo "API_KEY detected in workflow environment"
          else
            echo "API_KEY not set; using public endpoint access"
          fi

          (
            while true; do
              echo "heartbeat: still running at $(date -u +%H:%M:%S) UTC"
              sleep 5
            done
          ) &
          HEARTBEAT_PID=$!
          cleanup() {
            kill "$HEARTBEAT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          mkdir -p .logs
          PIPELINE_LOG=.logs/daily-pipeline.log

          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "Running explicit date input: ${{ github.event.inputs.date }}"
            stdbuf -oL -eL node scripts/runDaily.mjs "${{ github.event.inputs.date }}" 2>&1 | tee -a "$PIPELINE_LOG"
          else
            echo "Running default UTC date mode with fallback"
            stdbuf -oL -eL node scripts/runDaily.mjs 2>&1 | tee -a "$PIPELINE_LOG"
          fi

      - name: Upload pipeline log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-pipeline-log
          path: .logs/daily-pipeline.log
          if-no-files-found: ignore

      - name: Upload transient raw backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-active-snapshot
          path: data/raw/active/*.jsonl.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: Purge heavy transient data
        if: always()
        run: |
          set -euo pipefail
          rm -rf data/raw/active/*
          rm -rf data/processed-data
          rm -rf docs/data/processed-data

      - name: Commit data changes
        run: |
          set -euo pipefail
          echo "Pre-commit diagnostics"
          git status --short
          echo "Processed files:"
          find data/processed -type f | sort | head -n 20 || true
          echo "Docs processed files:"
          find docs/data/processed -type f | sort | head -n 20 || true

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed docs/data/processed
          git commit -m "data: active snapshot $(date -u +%F)"
          git push
